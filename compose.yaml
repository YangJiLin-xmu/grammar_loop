services:
  web:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env.local
    volumes:
      - local-data:/app/.data
    restart: unless-stopped
  worker:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    command: ["pnpm", "worker"]
    env_file: .env.local
    volumes:
      - local-data:/app/.data
    restart: unless-stopped
volumes:
  local-data:
